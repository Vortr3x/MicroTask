[package]
name = "microtask"
version = "0.1.0"
edition = "2021"
authors = ["Vortr3x"]
description = "Native Wayland and Linux macro recorder and player in Rust"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Vortr3x/MicroTask"
keywords = ["macro", "recorder", "wayland", "linux", "uinput"]
categories = ["command-line-utilities", "accessibility"]

[lib]
name = "microtask"
path = "src/lib.rs"

[[bin]]
name = "microtask"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["default", "wayland", "wgpu"] }
evdev = "0.13.2"
libc = "0.2.191"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spin_sleep = "1.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
