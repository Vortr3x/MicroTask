[package]
name = "microtask"
version = "0.3.0"
edition = "2021"
authors = ["Vortr3x"]
description = "Native Wayland and Linux macro recorder and player in Rust"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Vortr3x/MicroTask"
keywords = ["macro", "recorder", "wayland", "linux", "uinput"]
categories = ["command-line-utilities", "accessibility"]

[lib]
name = "microtask"
path = "src/lib.rs"

[[bin]]
name = "microtask"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["default", "wayland", "wgpu"] }
evdev = "0.13.2"
libc = "0.2.191"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spin_sleep = "1.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[package.metadata.deb]
maintainer = "Vortr3x <Vortr3x@users.noreply.github.com>"
copyright = "2026, Vortr3x"
license-file = ["LICENSE-MIT", "4"]
extended-description = """\
MicroTask is a lightweight macro recorder and player designed specifically \
for Wayland (KDE Plasma, GNOME, Sway, Hyprland) and X11 Linux desktop environments."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/microtask", "usr/bin/", "755"],
    ["assets/microtask.desktop", "usr/share/applications/", "644"],
    ["assets/microtask.png", "usr/share/icons/hicolor/256x256/apps/microtask.png", "644"],
    ["assets/microtask.svg", "usr/share/icons/hicolor/scalable/apps/microtask.svg", "644"],
    ["assets/99-uinput.rules", "usr/lib/udev/rules.d/", "644"],
    ["README.md", "usr/share/doc/microtask/README.md", "644"],
]

