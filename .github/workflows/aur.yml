name: Deploy to AUR

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy-aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish microtask to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        if: "${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}"
        with:
          pkgname: microtask
          pkgbuild: aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME || 'Vortr3x' }}
          commit_email: ${{ secrets.AUR_EMAIL || 'Vortr3x@users.noreply.github.com' }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
